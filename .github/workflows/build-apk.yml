name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        working-directory: artifacts/crash-speed-analyzer/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: artifacts/crash-speed-analyzer/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crash-speed-analyzer-debug-apk
          path: artifacts/crash-speed-analyzer/android/app/build/outputs/apk/debug/*.apk
