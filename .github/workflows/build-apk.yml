name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q Crash-Speed-Analyzer.zip -d extracted
          find extracted -type f -name gradlew -print

      - name: Find project root
        id: project
        run: |
          GRADLEW=$(find extracted -type f -path "*/android/gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Android Gradle wrapper was not found."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLEW")
          PROJECT_DIR=$(dirname "$ANDROID_DIR")
          WORKSPACE_ROOT=$(dirname "$(dirname "$PROJECT_DIR")")

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "workspace_root=$WORKSPACE_ROOT" >> "$GITHUB_OUTPUT"

          echo "Android project: $ANDROID_DIR"
          echo "Crash Speed Analyzer project: $PROJECT_DIR"
          echo "Workspace root: $WORKSPACE_ROOT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workspace dependencies
        working-directory: ${{ steps.project.outputs.workspace_root }}
        run: pnpm install --no-frozen-lockfile

      - name: Sync Capacitor Android
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: pnpm run android:sync

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.android_dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crash-speed-analyzer-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
