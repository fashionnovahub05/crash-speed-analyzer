name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q Crash-Speed-Analyzer.zip -d extracted
          find extracted -maxdepth 5 -type f -name gradlew -print

      - name: Find Android project
        id: project
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x "${{ steps.project.outputs.project_dir }}/gradlew"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crash-speed-analyzer-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
